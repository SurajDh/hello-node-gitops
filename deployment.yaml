apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-node

spec:
  replicas: 10

  selector:
    matchLabels:
      app: hello-node

  template:
    metadata:
      labels:
        app: hello-node

    spec:
      containers:
      - name: hello-node
        image: surajsdm/hello-node:37
        imagePullPolicy: Always

        ports:
        - env:\r\n        - name: APP_VERSION\r\n          value: 35\r\n        - name: BUILD_NUMBER\r\n          value: 35\r\n        - name: GIT_COMMIT\r\n          value: 3744fd8d24a7506d7d31022795a34d74f5c2f29e\r\n\r\n        containerPort: 3000
