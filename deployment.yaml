apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-node

spec:
  replicas: 10

  selector:
    matchLabels:
      app: hello-node

  template:
    metadata:
      labels:
        app: hello-node

    spec:
      containers:
      - name: hello-node
        image: surajsdm/hello-node:34
        imagePullPolicy: Always

        ports:
        - containerPort: 3000
